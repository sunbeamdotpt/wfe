[package]
name = "wfe-nats"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/sunbeamdotpt/wfe"
homepage = "https://github.com/sunbeamdotpt/wfe"
description = "NATS/JetStream queue, lock, and lifecycle publisher for the WFE workflow engine"

[features]
default = []
testing = ["dep:sdk"]

[dependencies]
wfe-core = { workspace = true, features = ["test-support"] }

async-nats = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

sdk = { version = "3.3.3", git = "https://github.com/sunbeamdotpt/sdk", default-features = false, features = ["testing"], optional = true }

[dev-dependencies]
wfe-core = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["test-util"] }
testcontainers = "0.27.3"
