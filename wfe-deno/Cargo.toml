[package]
name = "wfe-deno"
version = "1.9.1"
edition = "2024"
license = "MIT"
repository = "https://src.sunbeam.pt/studio/wfe"
homepage = "https://src.sunbeam.pt/studio/wfe"
description = "Deno bindings for the WFE workflow engine"

[dependencies]
wfe-core = { workspace = true, features = ["test-support"] }
wfe = { workspace = true }
deno_core = { workspace = true }
deno_error = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }

# Pin icu crates to 2.1.x -- icu 2.2 broke temporal_rs (deno_core transitive dep)
icu_calendar = ">=2.1, <2.2"

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tokio-util = "0.7"
tempfile = { workspace = true }
